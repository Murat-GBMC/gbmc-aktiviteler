<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk Bütçesi</title>
<style>
:root{
  --teal:#1F6F6F; --teal-d:#164f4f; --teal-l:#e3f2f2; --mint:#f4fbfb; --line:#cfe5e5;
  --ink:#1d2b2b; --muted:#5b6f6f; --amber:#c27c0e; --amber-l:#fff5e3; --amber-line:#f0d7a8;
  --ok:#1e7a4c; --ok-l:#e6f5ec; --bad:#b4442f; --bad-l:#fbecea;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Calibri,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--mint);line-height:1.5;font-size:16px}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 2px 10px rgba(31,111,111,.06)}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;color:var(--teal-d)}
h2{font-size:21px;margin:0 0 12px;color:var(--teal-d)}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 12px}
.sub{color:var(--muted)}
.memo{background:var(--mint);border-left:4px solid var(--teal);border-radius:8px;padding:14px 16px;margin:16px 0}
.memo .from{font-size:13px;color:var(--muted);margin-bottom:6px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.rule{background:var(--teal-l);border-radius:12px;padding:12px 14px;font-size:14px}
.rule b{display:block;color:var(--teal-d);font-size:15px;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;min-height:44px}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.amber{background:var(--amber)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* budget bar */
.budget{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(31,111,111,.08)}
.budget .line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.budget .big{font-size:20px;font-weight:800;color:var(--teal-d)}
.budget .big.over{color:var(--bad)}
.bar{height:10px;background:var(--teal-l);border-radius:999px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--teal);transition:width .25s}
.bar span.over{background:var(--bad)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--teal)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rc.opp{border-color:var(--amber-line);background:linear-gradient(#fffdf8,#fff)}
.rc .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rc .num{font-size:12px;font-weight:700;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--teal-l);color:var(--teal-d);white-space:nowrap}
.chip.amber{background:var(--amber-l);color:#8a5806}
.chip.red{background:var(--bad-l);color:var(--bad)}
.rc .desc{font-size:14px;color:#334545}
.optl{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:14px;transition:border-color .15s,background .15s}
.optl:hover{border-color:var(--teal)}
.optl input{margin-top:3px;width:18px;height:18px;accent-color:var(--teal);flex:0 0 auto}
.optl.sel{border-color:var(--teal);background:var(--mint)}
.optl .ot{font-weight:600}
.optl .st{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--teal);margin-right:6px}
.optl .eff{display:block;color:var(--muted);font-size:13px}
.optl .ev{display:none;font-size:12px;font-weight:700;color:var(--amber);margin-top:2px}
.showev .optl .ev{display:block}
.cost{margin-left:auto;font-weight:700;white-space:nowrap;padding-left:8px}
.warn{color:var(--bad);font-weight:600;font-size:14px}
/* run */
.months{display:grid;gap:14px}
.month h3{color:var(--teal-d);font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.ev-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.ev-row.show{opacity:1;transform:none}
.ev-row.hit{border-color:#efc6be;background:var(--bad-l)}
.ev-row.win{border-color:var(--amber-line);background:var(--amber-l)}
.ev-row.safe{border-color:#b9e0c9;background:var(--ok-l)}
.ev-row .res{font-weight:700;white-space:nowrap}
/* results */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--mint);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.kpi.net{background:var(--teal);color:#fff}.kpi.net .l{color:#d6eeee}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--teal-l);color:var(--teal-d);font-size:13px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.me td{font-weight:700}
.callout{background:var(--amber-l);border:1px solid var(--amber-line);border-radius:12px;padding:14px 16px;margin:16px 0}
.mcbars{display:grid;gap:10px;margin:12px 0}
.mcb .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.mcb .track{height:14px;background:var(--teal-l);border-radius:999px;overflow:hidden}
.mcb .fill{height:100%;border-radius:999px}
.lesson{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.lesson .top2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.badge.best{background:var(--ok-l);color:var(--ok)}
.badge.ok{background:var(--amber-l);color:#8a5806}
.badge.weak{background:var(--bad-l);color:var(--bad)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
.luckbox{background:var(--mint);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:6px 0 4px}
.lrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-size:15px}
.warnnote{margin:10px 0 0;background:var(--amber-l);border:1px solid var(--amber-line);border-radius:8px;padding:8px 10px;font-size:14px}
.mt{margin-top:18px}
@media (max-width:760px){.cards{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}h1{font-size:23px}.panel{padding:18px}}
</style>
</head>

  title:"Risk Budget", tag:"Taze Hat project · Limited budget, eight cards, one decision",
  memoFrom:"From Kerem Bey, to the Taze Hat project manager",
  memo:["I saw your risk list, well done. I am giving you a TL 400k budget for risk responses. There is no more.","It will not cover everything, I know. You decide how much goes where. Any money you do not spend stays with the company.","We will review the outcome together in four months."],
  r1:"Budget", r1t:"TL 400k. Choose one option per card. Doing nothing is also an option.",
  r2:"The project runs", r2t:"Over four months each risk happens or not, with the probability you chose.",
  r3:"Result", r3t:"Net result = − spend − losses + opportunity gain. You will see luck and decision quality separately.",
  start:"Start the game", remaining:"Budget left", of:"/", k:"k TL",
  showEv:"Show expected value (hint)", ev:"Expected impact", over:"You are over budget. Change some of your choices.",
  run:"Run the project", prob:"Probability", impact:"Impact", gain:"Gain", cost:"Cost",
  month:"Month", happened:"Happened", notHappened:"Did not happen", oppWon:"Opportunity captured", oppMissed:"Opportunity missed",
  spent:"Spend", losses:"Losses", gains:"Opportunity gain", net:"Net result",
  compare:"Comparison with the same dice", compareNote:"The three plans below faced exactly the same events this round. The difference comes only from decisions.",
  plan:"Plan", yours:"Your plan", nothing:"If you had done nothing", best:"Best plan within budget",
  mcBtn:"Play my plan 1,000 times", mcTitle:"Average after 1,000 rounds", mcNote:"A single round depends on luck. The average shows the quality of the decision.",
  beat:"Your plan did as well as or better than “doing nothing” in {x} of 1,000 rounds.",
  lessons:"Lessons card by card", your:"Your choice", bestCard:"Best option for this card", bestB:"Best choice", okB:"Reasonable", weakB:"Could improve",
  again:"Play again with the same plan", change:"Change my plan", restart:"Start over",
  luckTitle:"Luck or decision?", expLbl:"Your plan’s average expected result", thisLbl:"Your result this round", luckGood:"This round went better than your plan’s average. So luck was on your side this round.", luckBad:"This round went worse than your plan’s average. So luck was not on your side this round.", negNote:"A negative result is normal. In this project risks can only be reduced, not eliminated. The game measures how much you reduced the loss.", nothingWon:"Note: this round “doing nothing” did better than your plan. That can happen in a single round; it is luck. Play your plan 1,000 times to see the quality of the decision.",
  takeaway:"Remember: a good decision does not always bring a good outcome. But it wins on average. Risk management manages the average, not luck.",
  evLine:"Expected impact"}
};
/* ---------- STATE ---------- */
const qs = new URLSearchParams(location.search);
let lang = "tr"; // Bu okul yalnızca Türkçe. İngilizce sürüm ayrı okulda kurgulanacak.
/* Kişiselleştirme: ?name= parametresinden yalnızca ilk ad alınır. Hiçbir yere kaydedilmez veya gönderilmez. */
const firstName = (()=>{ const raw=(new URLSearchParams(location.search).get("name")||"").trim();
  if(!raw || /\{\{|\}\}/.test(raw)) return ""; const f=raw.split(/\s+/)[0].replace(/[^\p{L}\p{M}'’-]/gu,""); if(!/^\p{Lu}/u.test(f) || /[-_]/.test(f)) return ""; return f.slice(0,30); })();

let sel = CARDS.map(()=>0);
let showEv = false;
let last = null; // last run
let mc = null;
let notified = false;
const $ = s=>document.querySelector(s);
const app = $("#app");
const L = ()=>TX[lang];
const tt = o=>o[lang];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n=>{const v=Math.round(n); const s=Math.abs(v).toLocaleString(lang==="tr"?"tr-TR":"en-GB"); return (v<0?"−":"")+s;};
const money = n=> lang==="tr" ? `${fmt(n)} bin TL` : `TL ${fmt(n)}k`;
const signed = n=> (n>0?"+":"")+money(n);
const pct = p=>`%${Math.round(p*100)}`.replace(/^%(\d+)$/, lang==="tr"?"%$1":"$1%");

/* ---------- MODEL ---------- */
const optEV = (c,o)=> c.opp ? (o.p*o.i - o.c) : -(o.c + o.p*o.i);     // value (higher is better)
const spend = s=> s.reduce((a,k,j)=>a+CARDS[j].o[k].c,0);
function bestPlan(){ // brute force 3^8 within budget
  let best=null,bestV=-1e9; const n=CARDS.length; const total=Math.pow(3,n);
  for(let m=0;m<total;m++){ let x=m, s=[], c=0, v=0;
    for(let j=0;j<n;j++){ const k=x%3; x=(x-k)/3; s.push(k); const o=CARDS[j].o[k]; c+=o.c; v+=optEV(CARDS[j],o); }
    if(c<=BUDGET && v>bestV){bestV=v;best=s;} }
  return best;
}
const BEST = bestPlan();
const NOTHING = CARDS.map(()=>0);
function outcome(plan,u){ let sp=0,loss=0,gain=0; const ev=[];
  CARDS.forEach((c,j)=>{ const o=c.o[plan[j]]; sp+=o.c; const hit=u[j]<o.p;
    if(c.opp){ if(hit) gain+=o.i; } else { if(hit) loss+=o.i; } ev.push(hit); });
  return {sp,loss,gain,net:-sp-loss+gain,ev}; }
const dice = ()=>CARDS.map(()=>Math.random());

/* ---------- RENDER ---------- */
function setLang(l){ lang=l; document.documentElement.lang=l;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  $("#brand").textContent=L().brand; $("#foot").textContent=L().foot; document.title=L().title; route(); }
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
let screen="intro";
function route(){ ({intro:renderIntro,plan:renderPlan,run:renderRun,result:renderResult})[screen](); }

function renderIntro(){ const t=L();
  app.innerHTML=`<div class="panel">
   <h1>${t.title}</h1><p class="sub">${t.tag}</p>
   <div class="memo"><div class="from">${t.memoFrom}</div>${firstName?`<p>${lang==="tr"?"Merhaba":"Hi"} ${esc(firstName)},</p>`:""}${t.memo.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
   <div class="rules"><div class="rule"><b>1 · ${t.r1}</b>${t.r1t}</div><div class="rule"><b>2 · ${t.r2}</b>${t.r2t}</div><div class="rule"><b>3 · ${t.r3}</b>${t.r3t}</div></div>
   <button class="btn" id="go">${t.start}</button></div>`;
  $("#go").onclick=()=>{screen="plan";route();};
}
function budgetBar(){ const t=L(), s=spend(sel), rem=BUDGET-s, over=rem<0;
  return `<div class="budget"><div class="line">
     <div>${t.remaining}: <span class="big ${over?"over":""}">${money(rem)}</span> <span class="sub">${t.of} ${money(BUDGET)}</span></div>
     <label class="toggle"><input type="checkbox" id="evt" ${showEv?"checked":""}> ${t.showEv}</label></div>
     <div class="bar"><span class="${over?"over":""}" style="width:${Math.min(100,s/BUDGET*100)}%"></span></div>
     ${over?`<div class="warn" style="margin-top:6px">${t.over}</div>`:""}</div>`; }
function effText(c,o){ const t=L(); const parts=[];
  if(o.p!==c.p) parts.push(`${t.prob} ${pct(c.p)} → ${pct(o.p)}`); else parts.push(`${t.prob} ${pct(o.p)}`);
  const lab=c.opp?t.gain:t.impact;
  if(o.i!==c.i) parts.push(`${lab} ${money(c.i)} → ${money(o.i)}`); else parts.push(`${lab} ${money(o.i)}`);
  return parts.join(" · "); }
function renderPlan(){ const t=L();
  app.innerHTML = budgetBar() + `<div class="cards ${showEv?"showev":""}" id="cards">${CARDS.map((c,j)=>`
   <section class="rc ${c.opp?"opp":""}" aria-labelledby="ct${j}">
     <div class="hd"><div><div class="num">${c.opp?"★":"#"+c.id}</div><h3 id="ct${j}">${esc(tt(c.t))}</h3></div>
       <div class="chips"><span class="chip ${c.opp?"amber":""}">${esc(tt(c.cat))}</span></div></div>
     <div class="chips"><span class="chip ${c.opp?"amber":"red"}">${t.prob} ${pct(c.p)}</span><span class="chip ${c.opp?"amber":"red"}">${c.opp?t.gain:t.impact} ${money(c.i)}</span></div>
     <div class="desc">${esc(tt(c.d))}</div>
     ${c.o.map((o,k)=>`<label class="optl ${sel[j]===k?"sel":""}"><input type="radio" name="c${j}" value="${k}" ${sel[j]===k?"checked":""}>
        <span><span class="st">${esc(tt(ST[o.s]))}</span><span class="ot">${esc(tt(o.t))}</span><span class="eff">${effText(c,o)}</span>
        <span class="ev">${t.evLine}: ${signed(optEV(c,o))}</span></span><span class="cost">${money(o.c)}</span></label>`).join("")}
   </section>`).join("")}</div>
   <div class="row mt"><button class="btn" id="runb" ${spend(sel)>BUDGET?"disabled":""}>${t.run}</button></div>`;
  app.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",e=>{
    const j=+e.target.name.slice(1); sel[j]=+e.target.value; const y=window.scrollY; renderPlan(); window.scrollTo(0,y); }));
  $("#evt").onchange=e=>{showEv=e.target.checked; const y=window.scrollY; renderPlan(); window.scrollTo(0,y);};
  $("#runb").onclick=()=>{ const u=dice(); last={u, me:outcome(sel,u), no:outcome(NOTHING,u), best:outcome(BEST,u), plan:sel.slice()}; mc=null; screen="run"; route(); window.scrollTo(0,0); };
}
function renderRun(){ const t=L(); const months=[1,2,3,4];
  app.innerHTML=`<div class="panel"><h2>${t.run}…</h2><div class="months">${months.map(m=>`<div class="month"><h3>${t.month} ${m}</h3>${
     CARDS.map((c,j)=>c.month!==m?"":(()=>{const o=c.o[last.plan[j]]; const hit=last.me.ev[j];
       const cls=c.opp?(hit?"win":""):(hit?"hit":"safe");
       const res=c.opp?(hit?`${t.oppWon} ${signed(o.i)}`:t.oppMissed):(hit?`${t.happened} ${signed(-o.i)}`:t.notHappened);
       return `<div class="ev-row ${cls}" data-j="${j}"><span>${esc(tt(c.t))}</span><span class="res">${res}</span></div>`;})()).join("")}</div>`).join("")}</div></div>`;
  const rows=[...app.querySelectorAll(".ev-row")]; let k=0;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step=()=>{ if(k<rows.length){ rows[k++].classList.add("show"); setTimeout(step, reduce?0:450);} else setTimeout(()=>{screen="result";route();window.scrollTo(0,0);}, reduce?0:900); };
  step();
}
function runMC(){ const N=1000; let a={me:0,no:0,best:0}, beat=0;
  for(let r=0;r<N;r++){ const u=dice(); const m=outcome(last.plan,u).net, n=outcome(NOTHING,u).net, b=outcome(BEST,u).net;
    a.me+=m; a.no+=n; a.best+=b; if(m>=n) beat++; }
  mc={me:a.me/N,no:a.no/N,best:a.best/N,beat:beat/N}; }
function renderResult(){ const t=L(), r=last.me;
  const expMe = last.plan.reduce((a,k,j)=>a+optEV(CARDS[j],CARDS[j].o[k]),0);
  const luck = r.net >= expMe ? t.luckGood : t.luckBad;
  const nothingWon = last.no.net > r.net;
  if(!notified){ notified=true; try{ if(window.parent!==window) window.parent.postMessage({type:"gbmc-activity-complete",id:"RM-GAME",net:Math.round(r.net)},"*"); }catch(e){} }
  const rowsCmp=[[t.yours,last.me,true],[t.nothing,last.no,false],[t.best,last.best,false]];
  const mx = mc ? Math.max(Math.abs(mc.me),Math.abs(mc.no),Math.abs(mc.best),1) : 1;
  app.innerHTML=`<div class="panel">
   <h2>${t.net}</h2>
   <div class="kpis"><div class="kpi"><div class="l">${t.spent}</div><div class="v">${money(-r.sp)}</div></div>
     <div class="kpi"><div class="l">${t.losses}</div><div class="v">${money(-r.loss)}</div></div>
     <div class="kpi"><div class="l">${t.gains}</div><div class="v">${signed(r.gain)}</div></div>
     <div class="kpi net"><div class="l">${t.net}</div><div class="v">${signed(r.net)}</div></div></div>
   <div class="luckbox"><b>${firstName?esc(firstName)+", "+t.luckTitle.charAt(0).toLowerCase()+t.luckTitle.slice(1):t.luckTitle}</b>
     <div class="lrow"><span>${t.expLbl}</span><b>${signed(expMe)}</b></div>
     <div class="lrow"><span>${t.thisLbl}</span><b>${signed(r.net)}</b></div>
     <p style="margin:8px 0 6px">${luck}</p><p class="sub" style="margin:0">${t.negNote}</p>
     ${nothingWon?`<p class="warnnote">${t.nothingWon}</p>`:""}</div>
   <h3 class="mt">${t.compare}</h3><p class="sub">${t.compareNote}</p>
   <div class="tw"><table><thead><tr><th>${t.plan}</th><th class="n">${t.spent}</th><th class="n">${t.losses}</th><th class="n">${t.gains}</th><th class="n">${t.net}</th></tr></thead><tbody>
   ${rowsCmp.map(([n,o,me])=>`<tr class="${me?"me":""}"><td>${n}</td><td class="n">${money(-o.sp)}</td><td class="n">${money(-o.loss)}</td><td class="n">${signed(o.gain)}</td><td class="n">${signed(o.net)}</td></tr>`).join("")}
   </tbody></table></div>
   <div class="callout"><b>${t.mcTitle}</b><p class="sub" style="margin:4px 0 8px">${t.mcNote}</p>
    ${mc?`<div class="mcbars">${[[t.yours,mc.me,"var(--teal)"],[t.nothing,mc.no,"var(--bad)"],[t.best,mc.best,"var(--ok)"]].map(([n,v,col])=>`<div class="mcb"><div class="lbl"><span>${n}</span><b>${signed(v)}</b></div><div class="track"><div class="fill" style="width:${Math.abs(v)/mx*100}%;background:${col}"></div></div></div>`).join("")}</div>
      <p style="margin:0">${t.beat.replace("{x}",Math.round(mc.beat*1000).toLocaleString(lang==="tr"?"tr-TR":"en-GB"))}</p>`
      :`<button class="btn amber" id="mcb">${t.mcBtn}</button>`}
   </div>
   <p><b>${t.takeaway}</b></p>
   <h3 class="mt">${t.lessons}</h3>
   ${CARDS.map((c,j)=>{ const k=last.plan[j]; const vals=c.o.map(o=>optEV(c,o)); const bestK=vals.indexOf(Math.max(...vals));
      const gap=vals[bestK]-vals[k]; const badge = gap<0.5?["best",t.bestB]:(gap<=40?["ok",t.okB]:["weak",t.weakB]);
      return `<div class="lesson"><div class="top2"><b>${esc(tt(c.t))}</b><span class="badge ${badge[0]}">${badge[1]}</span></div>
        <div class="sub" style="font-size:14px">${t.your}: ${esc(tt(c.o[k].t))} (${t.ev}: ${signed(vals[k])})${k!==bestK?` · ${t.bestCard}: ${esc(tt(c.o[bestK].t))} (${signed(vals[bestK])})`:""}</div>
        <div style="font-size:14px;margin-top:4px">${esc(tt(c.lesson))}</div></div>`;}).join("")}
   <div class="row mt"><button class="btn" id="again">${t.again}</button><button class="btn ghost" id="chg">${t.change}</button><button class="btn ghost" id="rs">${t.restart}</button></div>
  </div>`;
  const b=$("#mcb"); if(b) b.onclick=()=>{ runMC(); const y=window.scrollY; renderResult(); window.scrollTo(0,y); };
  $("#again").onclick=()=>{ const u=dice(); last={u, me:outcome(last.plan,u), no:outcome(NOTHING,u), best:outcome(BEST,u), plan:last.plan.slice()}; mc=null; screen="run"; route(); window.scrollTo(0,0); };
  $("#chg").onclick=()=>{ screen="plan"; route(); window.scrollTo(0,0); };
  $("#rs").onclick=()=>{ sel=CARDS.map(()=>0); showEv=false; last=null; mc=null; screen="intro"; route(); window.scrollTo(0,0); };
}
setLang(lang);
</script>
</body>
</html>
